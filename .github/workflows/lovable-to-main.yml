name: Lovable to Main Review

on:
  push:
    branches:
      - lovable

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request from lovable to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head lovable \
            --title "Review Lovable changes" \
            --body "Automated PR from lovable branch to main for review." \
          || echo "PR already exists"